# plugin-catalog/hometown-arcade.yaml in a PR to NousResearch/hermes-agent.
name: hometown-arcade
repo: https://github.com/vdimarco/hermes-hometown
sha: 3987e0b427277836ce2b9521161a937d7f183429
title: Hometown Arcade
description: "Turn any real address into a drivable 3D browser game built from OpenStreetMap: real buildings with heights, named streets, parks, water and trees. The agent writes missions around the real cafés, parks and landmarks nearby, the game times your run on a car, a bike or on foot, and sends the result back so the agent can coach you or write a harder run. Six tools (build, places, mission, open, scores, maps), the /hometown slash command and a mission-writing skill. Disclosure — a build sends the place text to Nominatim (skipped for lat,lon) and the map's bounding box to public Overpass servers, falling back to the OpenStreetMap API for maps of 600 m or less; a local .osm file builds offline. The first build starts a web server on 127.0.0.1 in a background thread for the life of the Hermes process; it serves the game pages and accepts only finished-run results (Host-checked, 8 KB, schema-checked). Maps, missions and results are stored under <HERMES_HOME>/plugin-data/hometown-arcade/. With open_browser (and /hometown) it asks the OS to open the game URL. No credentials, no shell commands, no telemetry, no Python dependencies."
maintainer: vdimarco
